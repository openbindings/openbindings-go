version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/formats/asyncapi"
      - "/formats/connect"
      - "/formats/graphql"
      - "/formats/grpc"
      - "/formats/mcp"
      - "/formats/openapi"
      - "/formats/operationgraph"
      - "/formats/usage"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
