name: CI

on:
  push:
    branches: [main, "experiment/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - formats/openapi
          - formats/asyncapi
          - formats/graphql
          - formats/grpc
          - formats/connect
          - formats/mcp
          - formats/usage
          - formats/operationgraph
          - formats/workersrpc
    steps:
      - uses: actions/checkout@v7
      # The conformance corpora are normative and live in the sibling spec and
      # interfaces repos; without these checkouts the corpus gates skip
      # silently (which is how the family + interface corpora went unverified
      # on every PR). Unpinned default branch is deliberate: the SDK's main
      # tracks the spec working draft, so main<->main is the correct pairing
      # and drift should be loud. Every row needs the spec corpus (core + each
      # family lane); only the root module runs the interface corpora
      # (selection + comparison), so interfaces is checked out on that row only.
      - uses: actions/checkout@v7
        with:
          repository: openbindings/spec
          path: spec
      - uses: actions/checkout@v7
        if: matrix.module == '.'
        with:
          repository: openbindings/interfaces
          path: interfaces
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - name: workspace (resolve the untagged core from this checkout)
        # Format modules require the core at a version that is not tagged
        # yet. A CI-local go.work needs a version-pinned replace, not just
        # `use`: module-graph loading still fetches the required version's
        # go.mod, which does not exist anywhere ("unknown revision"). This
        # mirrors the local-dev go.work's replace directives. Harmless
        # post-tag (the replace maps the tagged version to this checkout).
        if: matrix.module != '.'
        run: |
          go work init . ${{ matrix.module }}
          ver=$(awk '/github.com\/openbindings\/openbindings-go v/ {print $NF}' ${{ matrix.module }}/go.mod)
          go work edit -replace "github.com/openbindings/openbindings-go@${ver}=."
      - name: vet ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        # -short is safe here: no corpus/conformance harness is testing.Short-
        # gated, so every corpus suite runs. OB_CORPUS_REQUIRED flips every
        # corpus locator from skip-if-absent to fail-if-absent, so a mis-wired
        # path or a missing checkout turns CI red instead of silently green;
        # local dev (flag unset) still skips. OB_INTERFACES_CORPUS is set only
        # on the root row, the only module that runs the interface corpora.
        run: go test -race -short ./...
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_INTERFACES_CORPUS: ${{ matrix.module == '.' && format('{0}/interfaces/conformance', github.workspace) || '' }}
          OB_CORPUS_REQUIRED: "1"
