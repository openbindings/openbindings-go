name: CI

on:
  push:
    branches: [main, release/0.2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      # The conformance corpora are normative and live in the sibling spec
      # repo; without this checkout the corpus gates skip silently. CI tests
      # the SDK against exactly the text it declares it applies, so no corpus
      # change can turn it red before the Go change that adopts it: the spec
      # revision appliedRevision names while appliedRelease is a working
      # draft, or the release tag v<appliedRelease> once appliedRevision is
      # "". The constants are read by parsing version.go, and each guard below
      # is fatal on its own.
      - name: Name the spec text this SDK applies
        id: applied
        run: |
          ref="$(go run .github/ci/appliedtext.go .)"
          [ -n "$ref" ] || { echo "version.go names no applied spec text"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openbindings/spec
          ref: ${{ steps.applied.outputs.ref }}
          path: spec
          # Its full history: the corpus adapter also reads appliedRevision's
          # openbindings.md and schema from it to verify the text it names.
          fetch-depth: 0
      # A revision is also required to lie on a branch of the spec repository:
      # checking out by SHA also reaches a commit only a pull request holds,
      # such as a spec change's head before it is squash-merged, which no
      # published history will keep. (fetch-depth: 0 fetched every branch.)
      - name: Check the spec checkout is the text named
        env:
          REF: ${{ steps.applied.outputs.ref }}
        run: |
          head="$(git -C spec rev-parse --verify HEAD^{commit})"
          case "$REF" in
            v*) named="$(git -C spec rev-parse --verify "refs/tags/$REF^{commit}")" ;;
            *) named="$(git -C spec rev-parse --verify "$REF^{commit}")" ;;
          esac
          [ -n "$named" ] || { echo "the spec history has no $REF"; exit 1; }
          [ "$head" = "$named" ] || { echo "the spec checkout is $head, not $REF ($named)"; exit 1; }
          case "$REF" in
            v*) ;;
            *) [ -n "$(git -C spec branch -r --contains "$named")" ] || { echo "appliedRevision $REF is on no branch of the spec repository: name a commit of a published branch, not one only a pull request holds"; exit 1; } ;;
          esac
      - name: vet
        run: go vet ./...
      - name: test
        # -short is safe here: no corpus/conformance harness is testing.Short-
        # gated, so every corpus suite runs. OB_CORPUS_REQUIRED flips every
        # corpus locator from skip-if-absent to fail-if-absent, so a mis-wired
        # path or a missing checkout turns CI red instead of silently green;
        # local dev (flag unset) still skips.
        run: go test -race -short ./...
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_CORPUS_REQUIRED: "1"
      # schemaeval is its own module, the project's evaluator; its tests run
      # the conformance kit (openbindingstest) against it, with the core
      # beside it through its replace directive.
      - name: vet schemaeval
        working-directory: schemaeval
        run: go vet ./...
      - name: test schemaeval
        working-directory: schemaeval
        # schemaeval's tests also execute the corpus's value cases under this
        # evaluator (the core's tests cannot import it), so they need the
        # corpus too.
        run: go test -race -short ./...
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_CORPUS_REQUIRED: "1"
      - name: vet httpdiscovery
        working-directory: httpdiscovery
        run: go vet ./...
      - name: test httpdiscovery
        working-directory: httpdiscovery
        run: go test -race -short ./...
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_CORPUS_REQUIRED: "1"
