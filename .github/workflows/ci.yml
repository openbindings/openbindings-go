name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - formats/openapi
          - formats/asyncapi
          - formats/graphql
          - formats/grpc
          - formats/connect
          - formats/mcp
          - formats/usage
          - formats/operationgraph
          - formats/workersrpc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.module == '.'
        with:
          repository: openbindings/spec
          path: spec
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - name: workspace (resolve the untagged core from this checkout)
        # Format modules require the core at a version that is not tagged
        # yet; a CI-local go.work resolves it from the same checkout, the
        # way local development does. Harmless post-tag (workspace wins).
        if: matrix.module != '.'
        run: go work init . ${{ matrix.module }}
      - name: vet ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: go test -race -short ./...
